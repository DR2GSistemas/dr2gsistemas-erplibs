name: erplibs CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit
        run: composer test

      - name: PHPStan (level 8, no baseline)
        run: composer analyse

      - name: Code style (PSR-12)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  integration:
    name: Integration (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dr2g_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit (unit + integration)
        run: composer test:all
        env:
          DR2G_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=dr2g_ci'
          DR2G_TEST_USER: root
          DR2G_TEST_PASSWORD: root
